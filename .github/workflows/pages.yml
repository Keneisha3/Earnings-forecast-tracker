name: pages

# Builds the dashboard (web/) with the latest data and publishes it to GitHub Pages.
# Runs on every push to main and after each data build. One-time setup: Settings > Pages >
# Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [data]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Data from the data branch, then the dashboard file
        run: |
          git fetch -q origin data
          mkdir -p data
          for f in $(git ls-tree --name-only origin/data companies/); do git show "origin/data:$f" > "data/$(basename "$f")"; done
          python -m eft.export --data data --out web/public/dashboard.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
